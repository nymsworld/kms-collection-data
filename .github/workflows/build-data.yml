name: Build Card Data

# KMS Collection's card data, every night after Card.api's last price run (part 10, ~09:50 UTC), published to the
# Cloudflare Pages project kms-collection-data (https://kms-collection-data.pages.dev/data/...), which the app reads.
# This repo is public so these runs cost no private Actions minutes. Run by hand: Actions → Build Card Data.
# A source that's down fails the run, and the live data stays on the last good night.
on:
  schedule:
    - cron: '45 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PROJECT: kms-collection-data
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22

      # Small copies of big card pictures (scripts/hosted-pictures.mjs): sharp resizes them, and the copies made so far
      # are kept between nights (a copy missing here is taken from the live site before being made again)
      - name: Install sharp
        run: npm install --no-save --no-package-lock sharp@0.35.5

      - name: Restore Picture Copies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pictures
          key: pictures-${{ github.run_id }}
          restore-keys: pictures-

      - name: Build Card Data
        run: node scripts/build-data.mjs

      - name: Save Picture Copies
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/pictures
          key: pictures-${{ github.run_id }}

      - name: Add Headers
        run: node scripts/headers.mjs

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.149.0 pages deploy out --project-name "$PROJECT" --branch main --commit-dirty=true
